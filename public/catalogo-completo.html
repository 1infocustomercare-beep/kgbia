<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Empire.AI — Portfolio & Catalogo Completo</title>
<meta name="description" content="Scopri 29+ progetti realizzati da Empire.AI: app white-label per ristoranti, hotel, beauty, fitness, NCC e 20+ altri settori.">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#020204;--surface:#0a0b10;--card:#111219;--border:#1e2030;--teal:#7eb7be;--violet:#6c3ce0;--gold:#d4a855;--text:#f0f0f5;--text-muted:#8a8ea0;--text-dim:#555770;--font-heading:'Space Grotesk',sans-serif;--font-body:'Inter',sans-serif}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}

/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:100;backdrop-filter:blur(20px);background:rgba(2,2,4,.75);border-bottom:1px solid var(--border)}
nav .inner{max-width:1200px;margin:0 auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:64px}
nav .logo{font-family:var(--font-heading);font-weight:700;font-size:1.3rem;background:linear-gradient(135deg,var(--teal),var(--violet));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
nav .links{display:flex;gap:24px;align-items:center}
nav .links a{font-size:.85rem;color:var(--text-muted);transition:color .25s}
nav .links a:hover{color:var(--teal)}
.nav-cta{padding:8px 20px;border-radius:10px;font-size:.82rem;font-weight:600;background:linear-gradient(135deg,var(--teal),var(--violet));color:#fff;border:none;cursor:pointer;transition:transform .2s}
.nav-cta:hover{transform:translateY(-1px)}
@media(max-width:768px){nav .links a:not(.nav-cta){display:none}}

/* HERO */
.catalog-hero{padding:120px 24px 60px;text-align:center;position:relative;overflow:hidden}
.catalog-hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 30%,rgba(108,60,224,.1),transparent 60%)}
.catalog-hero h1{font-family:var(--font-heading);font-size:clamp(2rem,5vw,3.5rem);font-weight:700;margin-bottom:12px;position:relative}
.catalog-hero h1 span{background:linear-gradient(135deg,var(--teal),var(--violet));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.catalog-hero p{color:var(--text-muted);font-size:1rem;max-width:600px;margin:0 auto 32px;position:relative}

/* FILTERS */
.filters{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:0 24px 40px;max-width:900px;margin:0 auto}
.filter-btn{padding:8px 18px;border-radius:99px;border:1px solid var(--border);background:transparent;color:var(--text-muted);font-size:.8rem;font-weight:500;cursor:pointer;transition:all .25s;font-family:var(--font-body)}
.filter-btn.active,.filter-btn:hover{background:rgba(126,183,190,.1);border-color:var(--teal);color:var(--teal)}

/* GRID */
.portfolio-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;max-width:1200px;margin:0 auto;padding:0 24px 80px}
@media(max-width:900px){.portfolio-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.portfolio-grid{grid-template-columns:1fr}}
.project-card{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;cursor:pointer;transition:all .4s cubic-bezier(.22,1,.36,1);position:relative}
.project-card:hover{transform:translateY(-6px);border-color:rgba(126,183,190,.3);box-shadow:0 16px 48px rgba(0,0,0,.4)}
.project-card .thumb{aspect-ratio:16/10;overflow:hidden;position:relative;background:var(--surface)}
.project-card .thumb img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.project-card:hover .thumb img{transform:scale(1.05)}
.project-card .thumb .cat-badge{position:absolute;top:12px;left:12px;padding:4px 12px;border-radius:99px;font-size:.65rem;font-weight:600;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);color:var(--teal);letter-spacing:1px;text-transform:uppercase}
.project-card .info{padding:16px}
.project-card .info h3{font-family:var(--font-heading);font-size:.95rem;font-weight:600;margin-bottom:4px;color:var(--text)}
.project-card .info p{font-size:.78rem;color:var(--text-muted);line-height:1.5;margin-bottom:10px}
.project-card .info .tags{display:flex;gap:6px;flex-wrap:wrap}
.project-card .info .tag{padding:3px 8px;border-radius:6px;font-size:.65rem;background:rgba(126,183,190,.08);color:var(--teal);border:1px solid rgba(126,183,190,.12)}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);backdrop-filter:blur(8px);z-index:300;display:none;align-items:center;justify-content:center;padding:24px}
.modal-overlay.open{display:flex}
.modal{background:var(--card);border:1px solid var(--border);border-radius:20px;max-width:800px;width:100%;max-height:90vh;overflow-y:auto;position:relative}
.modal-close{position:absolute;top:16px;right:16px;width:36px;height:36px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.1rem;z-index:2;transition:all .2s}
.modal-close:hover{background:var(--teal);color:#fff;border-color:var(--teal)}
.modal-img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:20px 20px 0 0}
.modal-body{padding:28px}
.modal-body h2{font-family:var(--font-heading);font-size:1.5rem;font-weight:700;margin-bottom:8px}
.modal-body .modal-cat{font-size:.75rem;color:var(--teal);text-transform:uppercase;letter-spacing:2px;margin-bottom:16px;font-weight:600}
.modal-body p{color:var(--text-muted);line-height:1.7;font-size:.9rem;margin-bottom:16px}
.modal-features{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.modal-features .feat{display:flex;align-items:center;gap:8px;font-size:.82rem;color:var(--text-muted)}
.modal-features .feat::before{content:'✓';color:var(--teal);font-weight:700}
.modal-cta{display:inline-flex;padding:12px 28px;border-radius:12px;background:linear-gradient(135deg,var(--teal),var(--violet));color:#fff;font-weight:600;border:none;cursor:pointer;transition:all .25s;font-size:.9rem}
.modal-cta:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(108,60,224,.3)}

/* CTA */
.bottom-cta{text-align:center;padding:80px 24px;position:relative;overflow:hidden}
.bottom-cta::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(126,183,190,.08),transparent 60%)}
.bottom-cta h2{font-family:var(--font-heading);font-size:clamp(1.8rem,4vw,2.5rem);font-weight:700;margin-bottom:12px;position:relative}
.bottom-cta p{color:var(--text-muted);margin-bottom:28px;position:relative}

/* Footer */
footer{border-top:1px solid var(--border);padding:32px 24px;text-align:center;font-size:.75rem;color:var(--text-dim)}
footer a{color:var(--teal)}

.grain{position:fixed;inset:0;pointer-events:none;z-index:9999;opacity:.03;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
</style>
</head>
<body>
<div class="grain"></div>

<nav><div class="inner">
  <a href="/landing" class="logo">Empire.AI</a>
  <div class="links">
    <a href="/landing#features">Funzionalità</a>
    <a href="/landing#pricing">Prezzi</a>
    <a href="/demo">Demo Live</a>

  </div>
</div></nav>

<section class="catalog-hero">

</section>

<div class="filters" id="filters"></div>
<div class="portfolio-grid" id="grid"></div>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <button class="modal-close" id="modalClose">✕</button>
    <img class="modal-img" id="modalImg" src="" alt="">
    <div class="modal-body">
      <div class="modal-cat" id="modalCat"></div>
      <h2 id="modalTitle"></h2>
      <p id="modalDesc"></p>
      <div class="modal-features" id="modalFeats"></div>
      <button class="modal-cta" onclick="location.href='/auth'">Richiedi una Demo →</button>

</div>

<footer>

  {id:10,name:'Studio Capelli Milano',cat:'beauty',desc:'Salone premium con booking multi-operatore, catalogo look e social integration.',tags:['Multi-Operatore','Look Book','Social'],features:['Booking multi-operatore','Catalogo look','Instagram integration','Anti no-show SMS','Prodotti e-commerce','Analytics team'],img:'beauty/beauty-mobile-1.webp'},
  {id:11,name:'Nails & Beauty Bar',cat:'beauty',desc:'Nail bar trendy con prenotazione express e sistema abbonamenti.',tags:['Express','Abbonamenti','Trendy'],features:['Booking express 60s','Sistema abbonamenti','Gallery portfolio','Notifiche push','Gift cards digitali','Referral program'],img:'beauty/beauty-mobile-2.webp'},
  {id:12,name:'FitPro Gym',cat:'health',desc:'Palestra con booking corsi, tracking progressi e community integrata.',tags:['Corsi','Tracking','Community'],features:['Booking corsi real-time','Tracking progressi','Community social','Piani allenamento AI','Abbonamenti digitali','Check-in QR'],img:'fitness/fitness-desktop-1.webp'},
  {id:13,name:'Yoga Flow Studio',cat:'health',desc:'Centro yoga con calendario lezioni, meditazione guidata e membership.',tags:['Lezioni','Meditazione','Membership'],features:['Calendario lezioni','Meditazioni guidate','Sistema membership','Streaming on-demand','Pacchetti personalizzati','Wellness tracking'],img:'fitness/fitness-mobile-1.webp'},
  {id:14,name:'CrossFit Arena',cat:'health',desc:'Box CrossFit con WOD tracking, leaderboard e gestione abbonamenti.',tags:['WOD','Leaderboard','Box'],features:['WOD giornaliero','Leaderboard live','Gestione box','PR tracking','Nutrizione AI','Challenge mensili'],img:'fitness/fitness-mobile-2.webp'},
  {id:15,name:'Studio Medico Salus',cat:'health',desc:'Poliambulatorio con prenotazione visite, telemedicina e cartella clinica digitale.',tags:['Visite','Telemedicina','Cartella'],features:['Prenotazione visite','Telemedicina HD','Cartella clinica digitale','Promemoria automatici','Prescrizioni digitali','GDPR compliant'],img:'healthcare/healthcare-desktop-1.webp'},
  {id:16,name:'Dott. Bianchi Dentista',cat:'health',desc:'Studio dentistico con agenda smart, preventivi digitali e follow-up automatici.',tags:['Agenda','Preventivi','Follow-up'],features:['Agenda smart','Preventivi digitali','Follow-up automatici','Gallery before/after','Piani di cura','Fatturazione elettronica'],img:'healthcare/healthcare-mobile-1.webp'},

  {id:18,name:'Tech Store Digital',cat:'retail',desc:'Negozio tecnologia con catalogo smart, comparatore e assistenza AI.',tags:['Catalogo','Comparatore','AI'],features:['Catalogo interattivo','Comparatore prodotti','Assistente AI','Prenotazione prodotti','Trade-in program','Recensioni verificate'],img:'retail/retail-mobile-1.webp'},
  {id:19,name:'Lido Azzurro Beach Club',cat:'hospitality',desc:'Stabilimento balneare con mappa interattiva, booking ombrelloni e bar service.',tags:['Mappa','Ombrelloni','Bar'],features:['Mappa interattiva','Booking ombrelloni real-time','Bar service in-app','Abbonamenti stagionali','Meteo integrato','Eventi beach party'],img:'beach/beach-desktop-1.webp'},

  {id:26,name:'Farmacia Centrale',cat:'health',desc:'Farmacia con prenotazione farmaci, consulenza e programma salute.',tags:['Farmaci','Consulenza','Salute'],features:['Prenotazione farmaci','Consulenza online','Programma salute','Promemoria terapie','Prodotti e-shop','Turni visibili'],img:'healthcare/healthcare-mobile-1.webp'},
  {id:27,name:'Music Academy',cat:'creative',desc:'Scuola musica con booking lezioni, streaming e tracking progressi allievi.',tags:['Lezioni','Streaming','Progressi'],features:['Booking lezioni','Streaming live','Tracking progressi','Repertorio digitale','Pagamenti rate','Recite ed eventi'],img:'fitness/fitness-mobile-1.webp'},
  {id:28,name:'Fiorista Verde Bosco',cat:'retail',desc:'Fiorista con catalogo stagionale, ordini online e consegne programmate.',tags:['Catalogo','Ordini','Consegne'],features:['Catalogo stagionale','Ordini online','Consegne programmate','Abbonamenti fiori','Gift & dediche','Workshop booking'],img:'retail/retail-mobile-1.webp'},
  {id:29,name:'AutoWash Premium',cat:'services',desc:'Autolavaggio con booking slot, abbonamenti e loyalty card digitale.',tags:['Booking','Abbonamenti','Loyalty'],features:['Booking slot','Abbonamenti mensili','Loyalty card digitale','Detailing menu','SMS promemoria','Report automezzi'],img:'trades/trades-mobile-2.webp'}
];

// Render filters
const filtersEl=document.getElementById('filters');
CATEGORIES.forEach(c=>{
  const btn=document.createElement('button');
  btn.className='filter-btn'+(c.id==='all'?' active':'');
  btn.textContent=c.label;
  btn.dataset.cat=c.id;
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    renderGrid(c.id);
  });
  filtersEl.appendChild(btn);
});

// Render grid
const grid=document.getElementById('grid');
function renderGrid(cat){
  const filtered=cat==='all'?PROJECTS:PROJECTS.filter(p=>p.cat===cat);
  grid.innerHTML='';
  filtered.forEach((p,i)=>{
    const card=document.createElement('div');
    card.className='project-card';
    card.style.opacity='0';card.style.transform='translateY(30px)';
    const catLabel=CATEGORIES.find(c=>c.id===p.cat)?.label||p.cat;
    card.innerHTML=`
      <div class="thumb">
        <img src="${MOCKUP_BASE}${p.img}" alt="${p.name}" loading="lazy" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 400 250%22><rect fill=%22%23111219%22 width=%22400%22 height=%22250%22/><text fill=%22%23555770%22 x=%22200%22 y=%22130%22 text-anchor=%22middle%22 font-size=%2214%22>${p.name}</text></svg>'">
        <div class="cat-badge">${catLabel}</div>
      </div>
      <div class="info">
        <h3>${p.name}</h3>
        <p>${p.desc}</p>
        <div class="tags">${p.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
      </div>`;
    card.addEventListener('click',()=>openModal(p));
    grid.appendChild(card);
    gsap.to(card,{opacity:1,y:0,duration:.5,delay:i*.06,ease:'power3.out'});
  });
}

// Modal
const modal=document.getElementById('modal');
function openModal(p){
  document.getElementById('modalImg').src=MOCKUP_BASE+p.img;
  document.getElementById('modalTitle').textContent=p.name;
  document.getElementById('modalCat').textContent=CATEGORIES.find(c=>c.id===p.cat)?.label||p.cat;
  document.getElementById('modalDesc').textContent=p.desc;
  document.getElementById('modalFeats').innerHTML=p.features.map(f=>`<div class="feat">${f}</div>`).join('');
  modal.classList.add('open');
  document.body.style.overflow='hidden';
}
document.getElementById('modalClose').addEventListener('click',()=>{modal.classList.remove('open');document.body.style.overflow=''});
modal.addEventListener('click',e=>{if(e.target===modal){modal.classList.remove('open');document.body.style.overflow=''}});

renderGrid('all');
gsap.registerPlugin(ScrollTrigger);
</script>
</body>
</html>
